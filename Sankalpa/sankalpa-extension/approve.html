<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sankalpa — allow access</title>
  <link rel="stylesheet" href="panel.css">
  <style>body{padding:20px} .panel{max-width:420px}</style>
</head>
<body>
  <div class="panel stack">
    <h1 style="font-size:19px">Allow Sankalpa to test this?</h1>
    <div id="what"></div>
    <p class="muted small">Chrome will ask you to confirm. You can remove access any time in chrome://extensions.</p>
    <div class="row"><button class="primary" id="allow">Allow</button><button id="cancel">Cancel</button></div>
  </div>
  <script src="approve.js"></script>
</body>
</html>
